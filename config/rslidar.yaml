common:
    lid_topic: "/lidar"
    imu_topic: "/imu"
    con_frame: false
    con_frame_num: 1
    cut_frame: false
    cut_frame_time_interval: 0.1
    time_diff_lidar_to_imu: 0.0

preprocess:
    # Livox driver2 PointCloud2 fields:
    # x/y/z/intensity/tag/line/timestamp.
    lidar_type: 5
    scan_line: 4
    scan_rate: 10
    # 0: second, 1: millisecond, 2: microsecond, 3: nanosecond.
    timestamp_unit: 3
    blind: 0.5

mapping:
    imu_en: true
    extrinsic_est_en: false
    imu_time_inte: 0.005
    lidar_time_inte: 0.1
    satu_acc: 30.0
    satu_gyro: 35
    acc_norm: 9.81
    lidar_meas_cov: 0.01
    acc_cov_output: 500
    gyr_cov_output: 1000
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    imu_meas_acc_cov: 0.1
    imu_meas_omg_cov: 0.1
    gyr_cov_input: 0.01
    acc_cov_input: 0.1
    plane_thr: 0.1
    match_s: 81
    ivox_grid_resolution: 2.0
    gravity: [0.0, 0.0, -9.810]
    # Not used while imu_en is true. This matches the first IMU samples in the
    # RS-LiDAR bags and is useful if you later test imu_en false.
    gravity_init: [0.484, 9.791, 0.366]
    # The bags publish both /lidar and /imu with frame_id lidar_link2. Replace
    # these with calibrated LiDAR-in-IMU extrinsics if your live setup differs.
    extrinsic_T: [0.0, 0.0, 0.0]
    extrinsic_R: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]

odometry:
    publish_odometry_without_downsample: false

publish:
    path_en: true
    scan_publish_en: true
    scan_bodyframe_pub_en: false
    map_publish_en: true          # publish the current internal iVox map on /Laser_map
    map_publish_interval: 1.0     # seconds; <= 0 publishes after every processed scan

pcd_save:
    pcd_save_en: false
    interval: -1

localization:
    enable: false
    map_path: "/home/robot/point_lio_ws/src/Point-LIO/PCD/scans.pcd"
    map_voxel_size: 0.5
    publish_map: true
    init_source: "rviz"
    initial_pose_topic: "/initialpose"
    wait_for_initial_pose: true
    init_x: 0.0
    init_y: 0.0
    init_z: 0.0
    init_roll: 0.0
    init_pitch: 0.0
    init_yaw: 0.0
